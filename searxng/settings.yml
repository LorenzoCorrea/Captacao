# Buscador próprio e grátis para o enriquecimento (workers/enrich.py).
# A chave secreta vem de SEARXNG_SECRET no .env; nunca coloque aqui.
use_default_settings: true
server:
  limiter: false
  image_proxy: false
search:
  formats: [html, json]
  default_lang: pt-BR
# Mais motores grátis: com vários, o bloqueio de um (DuckDuckGo/Brave na madrugada) não zera a busca.
# Google e Qwant negam acesso ao IP do Zima; Wikipedia só dá timeout e não tem telefone.
engines:
  - name: bing
    disabled: false
  - name: yahoo
    disabled: false
  - name: google
    disabled: true
  - name: qwant
    disabled: true
  - name: wikipedia
    disabled: true

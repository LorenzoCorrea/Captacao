# Prévias abertas ao público têm limite de acesso por IP.
limit_req_zone $binary_remote_addr zone=previa:10m rate=5r/s;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    # O servidor de mapas do OpenStreetMap bloqueia pedidos sem Referer.
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Login para todo o sistema (arquivo criado por scripts/create-login.sh).
    auth_basic "Captacao";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # SPA fallback: qualquer rota desconhecida cai no index.html (React Router).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Prévia de site do lead (HTML gerado pela API): é feita para o cliente abrir.
    location /previa/ {
        auth_basic off;
        limit_req zone=previa burst=20 nodelay;
        proxy_pass http://api:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # O webhook do WhatsApp só é usado pela rede interna do Docker.
    location /api/bot/webhook/ {
        return 404;
    }

    # Conversas do bot: a prévia em PDF enviada pelo Jarvis passa de 1 MB (limite padrão do nginx).
    # Sem barra no fim: com ela, o nginx redireciona /api/bot/conversations (lista) para a porta 80.
    location /api/bot/conversations {
        client_max_body_size 20m;
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy /api -> serviço da API (nome do serviço no docker-compose)
    location /api/ {
        proxy_pass http://api:3001;

        # ── Crítico para SSE (Server-Sent Events) ─────────────────────────
        # Sem isso, o nginx bufferiza a resposta e os eventos chegam em lote
        # depois de minutos. Com isso, fluem em tempo real.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;       # SSE pode ficar aberto bastante tempo
        proxy_send_timeout 24h;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Porta exclusiva para publicar as prévias na internet: não serve mais nada.
server {
    listen 8080;
    server_name _;

    add_header X-Content-Type-Options nosniff always;

    location /previa/ {
        limit_req zone=previa burst=20 nodelay;
        proxy_pass http://api:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        return 404;
    }
}

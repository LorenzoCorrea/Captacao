# Sobe o sistema Captação inteiro no Zima (ou em qualquer host com Docker).
# Como subir no ZimaOS:
#   1. Copie este projeto pro Zima (git clone) e crie um .env (veja .env.example)
#   2. docker compose up -d --build
#   3. Acesse pelo IP da Tailscale do Zima: http://100.x.y.z (veja o seu em tailscale.com/admin)
#
# O Postgres NÃO está aqui — ele já roda no Zima como container separado, e
# este compose se conecta nele via host.docker.internal:5432 (veja extra_hosts).

services:
  # ── API Node + worker Python ──────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped

    # Lê DATABASE_URL e qualquer override do .env na raiz do projeto.
    env_file:
      - .env

    # Sem isso, o container usa UTC e o "hoje" vira às 21h no Brasil.
    environment:
      TZ: ${TZ:-America/Sao_Paulo}

    # host.docker.internal aponta para o IP do host (Zima) — permite o
    # container falar com o Postgres que roda fora do compose.
    # Em Linux puro, esse mapeamento exige a flag abaixo (no Docker Desktop é automático).
    extra_hosts:
      - "host.docker.internal:host-gateway"

    # Saúde: se /api/status responder, está vivo. O nginx só roteia quando OK.
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3001/api/status').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── Front (build estático servido pelo nginx) ─────────────────────────────
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

    # Porta exposta no host. Em produção fica em 80 (HTTP padrão), assim você
    # acessa só `http://IP_DO_ZIMA` sem precisar de :porta.
    ports:
      - "${WEB_PORT:-80}:80"
      # Só para publicar as prévias (ex.: tailscale funnel); não sai deste computador.
      - "127.0.0.1:${PREVIEW_PORT:-8080}:8080"

    # Crie antes de subir: sh scripts/create-login.sh USUARIO
    volumes:
      - ./.htpasswd:/etc/nginx/.htpasswd:ro

  # ── Gateway do WhatsApp: sem porta publicada, só o Captação fala com ele ────
  evolution:
    image: evoapicloud/evolution-api:v2.3.7
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:?defina no .env}
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: ${EVOLUTION_DATABASE_URI:?defina no .env}
      DATABASE_CONNECTION_CLIENT_NAME: evolution
      CACHE_REDIS_ENABLED: "false"
      CACHE_LOCAL_ENABLED: "true"
      TELEMETRY_ENABLED: "false"
      LOG_LEVEL: ERROR,WARN
    volumes:
      - evolution_instances:/evolution/instances

  # ── Roteador de modelos de IA; o painel só abre neste computador ────────────
  router9:
    image: decolua/9router:0.5.104
    restart: unless-stopped
    environment:
      DATA_DIR: /app/data
      NEXT_TELEMETRY_DISABLED: "1"
      INITIAL_PASSWORD: ${ROUTER9_PASSWORD:?defina no .env}
    ports:
      - "127.0.0.1:20128:20128"
    volumes:
      - router9_data:/app/data

volumes:
  evolution_instances:
  router9_data:

